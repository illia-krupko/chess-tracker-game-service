services:
  game-service:
    build: .
    restart: on-failure

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/game_service_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    networks:
      - gateway-game-service
      - game-service-postgres
      - game-service-kafka

networks:
  gateway-game-service:
    external: true

  game-service-postgres:
    external: true

  game-service-kafka:
    external: true
